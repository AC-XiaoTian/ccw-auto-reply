name: CCW 自动回复

# ─── 节奏（2026-11-15 最终版）───
# 每 5 分钟检测一次（GitHub 的 schedule 最小粒度就是 5 分钟）。
# 检测频率 ≠ 发送量：每轮最多回 2 条，没有新留言就什么都不发。
# 发送量只取决于新留言多少，不会因为查得勤就刷屏。

on:
  schedule:
    # 每 5 分钟，偏移 2 分起跳，避开整点拥堵
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只打印要回复什么，不真的发送"
        type: boolean
        default: true

# 需要把 state.json 提交回仓库
permissions:
  contents: write

# 同一时间只跑一个实例，避免两轮互相覆盖状态
concurrency:
  group: ccw-auto-reply
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 没配 Cookie 时静默跳过，而不是每轮失败一次刷失败邮件
      - name: 检查 CCW_COOKIE
        id: guard
        env:
          CCW_COOKIE: ${{ secrets.CCW_COOKIE }}
        run: |
          if [ -z "$CCW_COOKIE" ]; then
            echo "::warning::未配置 CCW_COOKIE，本次跳过。到 Settings → Secrets and variables → Actions 添加后它就会自动开始跑。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "Cookie 已配置，长度 ${#CCW_COOKIE}（内容不打印）"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 执行自动回复
        if: steps.guard.outputs.ready == 'true'
        env:
          CCW_COOKIE: ${{ secrets.CCW_COOKIE }}
          # 定时任务真发；手动触发默认 dry-run，除非把勾去掉
          CCW_AUTO_REPLY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && '0' || '1' }}

          # AI（不配就走兜底文案，不会报错）
          AI_API_URL: ${{ vars.AI_API_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_SYSTEM_PROMPT: ${{ vars.AI_SYSTEM_PROMPT }}

          CCW_MAX_AGE_HOURS: "24"
          CCW_MAX_PER_RUN: "2"
          CCW_CYCLES: "1"
          CCW_CYCLE_GAP_SEC: "150"
          # 首次运行只认领历史通知、不发送：state.json 是空的，脚本不知道你手动回过哪些，
          # 直接真发会重复回复。state 非空后这个开关就自动失效。
          CCW_BOOTSTRAP: "1"
          # AI 组织上限 3 次/分钟，两次调用最小间隔 21 秒
          AI_MIN_INTERVAL_MS: "21000"
          # Cookie 失效时同一个故障 24 小时内只报红一次，避免每轮刷失败邮件
          CCW_AUTH_FAIL_THROTTLE_HOURS: "24"
        run: node ccw-auto-reply.js

      - name: 保存去重状态
        # always()：鉴权失败时也要把 authFailAt 存下来，否则限流计数永远不生效
        # 手动跑真实发送（dry_run=false）也提交，这样首跑的「认领」能立刻落盘
        if: always() && steps.guard.outputs.ready == 'true' && (github.event_name == 'schedule' || github.event.inputs.dry_run == 'false')
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "状态没有变化，跳过提交"
            exit 0
          fi
          git add state.json
          git commit -m "state: $(date -u +%F_%H:%M) [skip ci]"
          # push 可能因并发或网络失败。失败就不只是丢日志——下一轮会重发同一批评论，
          # 所以重试三次，仍失败就显式报错。
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              echo "状态已提交（第 $i 次尝试）"
              exit 0
            fi
            echo "push 失败，10 秒后重试（第 $i 次）"
            sleep 10
          done
          echo "::error::state.json 三次提交均失败，下一轮可能重复回复，请人工检查"
          exit 1

      - name: 失败时给出方向
        if: failure()
        run: |
          echo "::warning::任务失败。最常见两个原因：① CCW 的 token 过期（有效期约 16 天）——重新从浏览器复制 Cookie 更新 CCW_COOKIE；② GitHub 机房 IP 被 CCW 风控——换国内云函数跑，代码不用改。"
