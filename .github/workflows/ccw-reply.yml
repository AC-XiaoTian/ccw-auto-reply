name: CCW 自动回复

# ─── 节奏（2026-11-15 第四版）───
# 实测三件事：
#   1. GitHub 免费 cron 极不可靠：设了每 5 分钟，实测两次 schedule 之间能隔 25~45 分钟。
#   2. 靠 cron 做“每 3 分钟检测”做不到，所以单次运行内部连轮，轮间隔 120 秒。
#   3. 运行本身只要 8 分钟，跑完到下一次 cron 之间的空窗才是漏回复的主因。
# 所以现在加一条「接力」：每次跑完用自己的 token 再派发一次 workflow_dispatch，
#   下一波立即接上，不需要等 cron。cron 只当保险丝（接力断了、token 失效时。它会兜一下）。
# 接力链里每波 4 轮 × 120 秒 ≈ 8 分钟，两波首尾相接，检测间隔稳定在 3 分钟出头。
# 每轮最多回 3 条；没有新留言就空转，不发东西。

on:
  schedule:
    # 保险丝：接力断了也能自己爬起来（实际会被 GitHub 降频，不能当主力）
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只打印要回复什么，不真的发送"
        type: boolean
        default: true
      delete_ids:
        description: "要删除的评论 id（逗号分隔），填了就只删不回复，用来清脏数据"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

# 同一时间只跑一个实例，避免两轮互相覆盖状态。
# cancel-in-progress 必须保持 false：跑到一半被砍掉，本轮已回复的记录来不及提交，
# 下一轮会把同样的留言再回一遍。
concurrency:
  group: ccw-auto-reply
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    # 4 轮 × 120 秒 ≈ 8 分钟，加上 AI 调用留到 15 分钟
    timeout-minutes: 15

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 没配 Cookie 时静默跳过，而不是每轮失败一次刷失败邮件
      - name: 检查 CCW_COOKIE
        id: guard
        env:
          CCW_COOKIE: ${{ secrets.CCW_COOKIE }}
        run: |
          if [ -z "$CCW_COOKIE" ]; then
            echo "::warning::未配置 CCW_COOKIE，本次跳过。到 Settings → Secrets and variables → Actions 添加后它就会自动开始跑。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "Cookie 已配置，长度 ${#CCW_COOKIE}（内容不打印）"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 执行自动回复
        if: steps.guard.outputs.ready == 'true'
        env:
          CCW_COOKIE: ${{ secrets.CCW_COOKIE }}
          # 定时任务真发；手动触发默认 dry-run，除非把勾去掉
          CCW_AUTO_REPLY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && '0' || '1' }}

          # AI（不配就走兜底文案，不会报错）
          AI_API_URL: ${{ vars.AI_API_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_SYSTEM_PROMPT: ${{ vars.AI_SYSTEM_PROMPT }}

          CCW_MAX_AGE_HOURS: "24"
          # 每轮最多回 3 条
          CCW_MAX_PER_RUN: "3"
          # 「AI助手」这类账号你一回它就再发一条新通知，会形成回声循环，一律不回
          CCW_IGNORE_NICKNAMES: "AI助手"
          # 清脏数据：填了 id 就只删不回复
          CCW_DELETE_IDS: ${{ github.event.inputs.delete_ids }}
          # 单次 4 轮：一轮回满 3 条要 70~90 秒（AI 调用之间还隔着 21 秒限流），
          # 120 秒间隔下真实检测点落在 3 分钟出头。
          CCW_CYCLES: "4"
          CCW_CYCLE_GAP_SEC: "120"
          # 首次运行只认领历史通知、不发送：state.json 是空的，脚本不知道你手动回过哪些，
          # 直接真发会重复回复。state 非空后这个开关就自动失效。
          CCW_BOOTSTRAP: "1"
          # AI 组织上限 3 次/分钟，两次调用最小间隔 21 秒
          AI_MIN_INTERVAL_MS: "21000"
          # Cookie 失效时同一个故障 24 小时内只报红一次，避免每轮刷失败邮件
          CCW_AUTH_FAIL_THROTTLE_HOURS: "24"
        run: node ccw-auto-reply.js

      - name: 保存去重状态
        # always()：鉴权失败时也要把 authFailAt 存下来，否则限流计数永远不生效
        # 删除模式不碰状态；手动跑真实发送（dry_run=false）也提交，这样首跑的「认领」能立刻落盘
        if: always() && steps.guard.outputs.ready == 'true' && !github.event.inputs.delete_ids && (github.event_name == 'schedule' || github.event.inputs.dry_run == 'false')
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 本轮状态先存一份出来。一轮要跑十几分钟，期间远端可能已经被别的 commit 改过，
          # 直接 push 会冲突（之前就是这样失败三次、状态没落盘、下一轮重复回复）。
          cp state.json "$RUNNER_TEMP/state-local.json"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # 把本轮新增的记录并进远端最新版，而不是覆盖
            node merge-state.js "$RUNNER_TEMP/state-local.json" state.json
            if [ -z "$(git status --porcelain state.json)" ]; then
              echo "状态没有变化，跳过提交"
              exit 0
            fi
            git add state.json
            git commit -m "state: $(date -u +%F_%H:%M) [skip ci]"
            if git push origin HEAD:main; then
              echo "状态已提交（第 $i 次尝试）"
              exit 0
            fi
            echo "push 失败，10 秒后重试（第 $i 次）"
            sleep 10
          done
          echo "::error::state.json 三次提交均失败，下一轮可能重复回复，请人工检查"
          exit 1

      # 接力：跑完自己派发下一次，把 cron 那 25~45 分钟的空窗吃掉。
      # 只在 Cookie 正常、且不是清脏数据/演示模式时接力；否则静默跳过、等 cron 兜底。
      - name: 接力触发下一波
        if: always() && steps.guard.outputs.ready == 'true' && !github.event.inputs.delete_ids && (github.event_name == 'schedule' || github.event.inputs.dry_run == 'false')
        env:
          DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning::未配置 GH_DISPATCH_TOKEN，无法接力，回退为 cron 触发（间隔会很长）。"
            exit 0
          fi
          # 先存一份令牌，避免下面 curl 失败时命令报错退出
          set +e
          code=$(curl -s -o /tmp/d.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"ref":"main","inputs":{"dry_run":"false"}}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ccw-reply.yml/dispatches")
          if [ "$code" = "204" ]; then
            echo "接力成功，下一波已派发"
          else
            echo "::warning::接力派发失败（HTTP $code），回退为 cron 触发：以下为服务端返回"
            head -c 300 /tmp/d.json
            echo
          fi

      # Cookie 失效时自动开 Issue。没有这一步，失效就是「一声不响地停掉」，
      # 因为鉴权失败被限流成 24 小时才报红一次，很容易错过。
      - name: Cookie 失效时开 Issue 提醒
        if: always() && steps.guard.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node cookie-alert.js

      - name: 失败时给出方向
        if: failure()
        run: |
          echo "::warning::任务失败。最常见两个原因：① CCW 的登录态过期——重新从浏览器复制 Cookie 更新 CCW_COOKIE（失效时会自动开 Issue 提醒）；② GitHub 机房 IP 被 CCW 风控——换国内云函数跑，代码不用改。"
